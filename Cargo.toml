[package]
name = "threeputt"
version = "0.2.1"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Client library for the ExPutt RG putting device over WiFi"
repository = "https://github.com/divotmaker/3putt"
readme = "README.md"
keywords = ["golf", "putting", "exputt", "zeromq"]
categories = ["network-programming", "hardware-support"]
exclude = [".github/", "rust-toolchain.toml"]

[lib]
name = "threeputt"

[features]
default = ["net"]
# Device discovery (`discover`): the UDP beacon socket, which needs `socket2`.
# Without it the crate builds for targets with no sockets, such as
# `wasm32-unknown-unknown`, for the `config` feature.
net = ["dep:socket2"]
# Test support: `threeputt::testing` (an in-process mock device speaking the
# device side of the protocol, sample result strings), and the driver's
# `Tuning`. Off by default.
testing = []
# `threeputt::config`: the driver's settings, with no network dependency.
config = ["dep:flightrelay", "flightrelay/config"]
# `threeputt::driver`: the flightrelay `DeviceDriver` for the ExPutt RG.
driver = ["config", "net", "flightrelay/driver"]
# The `threeputt-frp` binary: the driver served to FRP controllers.
frp = ["driver", "flightrelay/server", "flightrelay/main"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# SO_REUSEADDR on the discovery socket, which std cannot set before bind.
socket2 = { version = "0.6", optional = true }
# The FRP types, driver contract and server (features `config`, `driver`, `frp`).
flightrelay = { version = "0.6.0", default-features = false, optional = true }

[dev-dependencies]
# Ctrl-C handling in examples/monitor.rs.
ctrlc = "3"

[[test]]
name = "session"
required-features = ["testing"]

[[bin]]
name = "threeputt-frp"
required-features = ["frp"]

[[example]]
name = "monitor"
required-features = ["net"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
